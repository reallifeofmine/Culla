name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit 2>&1 | tee -a build.log
          npm test 2>&1 | tee -a build.log
        shell: bash -o pipefail {0}

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log
        shell: bash -o pipefail {0}
        env:
          CULLA_BUILD: ${{ github.run_number }}

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain 2>&1 | tee -a ../build.log
        shell: bash -o pipefail {0}
        env:
          CULLA_BUILD: ${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk culla.apk
          gh release create "$TAG" culla.apk --title "Culla $VERSION (build ${{ github.run_number }})" \
            --notes "Install: open this page on your Android phone and tap culla.apk." --latest

      - name: Save failure log
        if: failure()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          tail -c 200000 build.log > /tmp/build-tail.log || true
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build-tail.log build.log
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > info.txt
          git add build.log info.txt
          git commit -m "CI log for run ${{ github.run_number }}"
          git push -f origin ci-logs
