plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cullanative'
version = '0.1.0'

android {
  namespace "expo.modules.cullanative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Applied to the app's release build so the AI libraries survive code shrinking.
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
  // TensorFlow Lite memory-maps the model, so it must stay uncompressed in the APK.
  androidResources {
    noCompress 'tflite'
  }
}

dependencies {
  // On-device AI. Bundled models: no Google Play download step, works offline.
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:image-labeling:17.0.9'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'org.tensorflow:tensorflow-lite:2.16.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
  implementation 'androidx.core:core:1.13.1'
}
